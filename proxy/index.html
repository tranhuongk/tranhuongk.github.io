<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Quản lý proxy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="login" class="login" hidden>
      <form id="login-form" class="panel login-box">
        <h1>Quản lý proxy</h1>
        <label for="login-pass">Mật khẩu quản trị</label>
        <input id="login-pass" type="password" autocomplete="current-password" required />
        <button type="submit" class="primary">Đăng nhập</button>
        <p id="login-msg" class="msg" role="alert"></p>
      </form>
    </main>

    <div id="app" hidden>
      <header class="top">
        <div class="brand">
          <h1>Proxy Hà Nội</h1>
          <span id="status" class="pill">…</span>
        </div>
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="live" aria-selected="true">Đang kết nối</button>
          <button role="tab" data-tab="ips">Theo IP</button>
          <button role="tab" data-tab="log">Nhật ký</button>
          <button role="tab" data-tab="users">User</button>
          <button role="tab" data-tab="blocked">Chặn</button>
          <button role="tab" data-tab="settings">Cài đặt</button>
        </nav>
      </header>
      <p id="toast" class="toast" role="status" hidden></p>

      <section id="tab-live" class="tab">
        <div class="stats" id="live-stats"></div>
        <div class="bar">
          <h2>Proxy</h2>
          <label class="check"><input type="checkbox" id="auto" checked /> Tự cập nhật 5 giây</label>
        </div>
        <div id="live-proxy" class="list"></div>
        <h2>VPN</h2>
        <div id="live-vpn" class="list"></div>
      </section>

      <section id="tab-ips" class="tab" hidden>
        <div class="bar">
          <h2>Các IP đã kết nối</h2>
          <select id="ips-days" aria-label="Khoảng thời gian">
            <option value="1">24 giờ</option>
            <option value="7">7 ngày</option>
            <option value="30" selected>30 ngày</option>
            <option value="90">90 ngày</option>
          </select>
        </div>
        <div id="ips-list" class="list"></div>
      </section>

      <section id="tab-log" class="tab" hidden>
        <div class="filters">
          <input id="log-q" type="search" placeholder="Tìm IP, user, trang…" aria-label="Tìm" />
          <select id="log-kind" aria-label="Loại">
            <option value="">Tất cả</option>
            <option value="proxy">Proxy</option>
            <option value="wireguard">WireGuard</option>
            <option value="ikev2">IKEv2</option>
          </select>
          <label class="check"><input type="checkbox" id="log-failed" /> Chỉ sai mật khẩu</label>
        </div>
        <div id="log-list" class="list"></div>
        <button id="log-more" class="ghost wide" hidden>Xem thêm</button>
      </section>

      <section id="tab-users" class="tab" hidden>
        <form id="user-form" class="panel form-row">
          <input id="user-name" placeholder="Tên user (vd: lan)" required autocapitalize="off" autocomplete="off" />
          <input id="user-pass" placeholder="Mật khẩu (trống = tự tạo)" autocapitalize="off" autocomplete="off" />
          <input id="user-note" placeholder="Ghi chú (ai dùng)" autocomplete="off" />
          <button type="submit" class="primary">Thêm user</button>
        </form>
        <div id="users-list" class="list"></div>
      </section>

      <section id="tab-blocked" class="tab" hidden>
        <form id="block-form" class="panel form-row">
          <input id="block-ip" placeholder="IP hoặc dải (vd 1.2.3.4, 1.2.3.0/24)" required autocomplete="off" />
          <input id="block-note" placeholder="Lý do" autocomplete="off" />
          <button type="submit" class="danger">Chặn</button>
        </form>
        <p class="hint">Bị chặn thì IP đó không dùng được proxy và VPN; các kết nối đang mở bị ngắt ngay.</p>
        <div id="blocked-list" class="list"></div>
      </section>

      <section id="tab-settings" class="tab" hidden>
        <form id="pw-form" class="panel stack">
          <h2>Đổi mật khẩu quản trị</h2>
          <input id="pw-old" type="password" placeholder="Mật khẩu hiện tại" autocomplete="current-password" required />
          <input id="pw-new" type="password" placeholder="Mật khẩu mới (ít nhất 10 ký tự)" autocomplete="new-password" minlength="10" required />
          <button type="submit" class="primary">Đổi mật khẩu</button>
        </form>
        <div class="panel stack">
          <h2>Kết nối proxy</h2>
          <p class="hint">Một cổng nhận cả HTTP lẫn SOCKS5: <code>103.75.184.121:48080</code></p>
          <button id="logout" class="ghost">Đăng xuất</button>
        </div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
