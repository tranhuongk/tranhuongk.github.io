<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <title>Personal Post Scheduler - Authorization</title>
    <link rel="icon" href="icon.png">
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px; color: #222; line-height: 1.6; }
        h1 { text-align: center; }
        textarea { width: 100%; height: 120px; font-family: monospace; font-size: 13px; }
        button { padding: 8px 16px; font-size: 15px; }
    </style>
</head>
<body>
    <h1>Authorization finished</h1>
    <p>Copy the address below and paste it back into the Personal Post Scheduler terminal. Nothing on this page is sent anywhere.</p>
    <textarea id="u" readonly></textarea>
    <p><button id="c">Copy</button> <span id="m"></span></p>
    <script>
        var t = document.getElementById('u');
        t.value = location.href;
        document.getElementById('c').onclick = function () {
            t.select();
            try { document.execCommand('copy'); document.getElementById('m').textContent = 'Copied'; } catch (e) {}
        };
    </script>
</body>
</html>
